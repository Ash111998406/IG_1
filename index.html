<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Instagram Link Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Hi, I’m Ash Wai 👋</h1>
    <p>This is my personal page! Check out my socials and a mini-game below.</p>
    
    <!-- Buttons -->
    <div class="buttons">
      <a href="https://instagram.com/yourusername" target="_blank">Instagram</a>
      <a href="https://youtube.com/yourchannel" target="_blank">YouTube</a>
      <a href="https://t.me/yourusername" target="_blank">Telegram</a>
    </div>
    
    <!-- Mini-game placeholder -->
    <div id="game">
      <p>Mini-game will appear here!</p>
      <iframe src="https://your-game-link.vercel.app" width="300" height="400"></iframe>
    </div>
    
    <footer>
      <p style="font-size:12px;color:gray;">Game by Gabriele Cirulli (MIT License)</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
